<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Report - Intern Dialogika</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="assets/css/style.css" rel="stylesheet" />
    <style>
        .history-item{border:1px solid #e5e7eb;border-radius:16px;padding:14px 16px;margin-bottom:12px;background:#fff}
        .task-item{border:1px solid #e5e7eb;border-radius:12px;padding:10px 12px;background:#fff}
    </style>
</head>
<body>
    <div id="topbarContainer"></div>
    <div class="dashboard-container">
        <div id="sidebarContainer"></div>
        <main class="main-content">
            <div class="mb-4"><h4 class="fw-bold mb-0">Daily Report</h4><small class="text-muted">Kirim laporan harian internship.</small></div>
            <div class="row g-4">
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm rounded-4"><div class="card-body p-4">
                        <form id="dailyReportForm">
                            <div class="mb-3"><label class="form-label">Tanggal</label><input type="date" id="reportDate" class="form-control" readonly></div>
                            <div class="mb-3"><label class="form-label">Nama</label><input type="text" id="reportName" class="form-control" readonly></div>
                            <div class="mb-3"><label class="form-label">Departemen & Posisi</label><input type="text" id="reportDeptPos" class="form-control" readonly></div>
                            <div class="mb-3"><label class="form-label">Tugas</label><div id="tasksContainer" class="d-flex flex-column gap-2"></div><button type="button" class="btn btn-sm btn-outline-secondary mt-2" onclick="addTask()"><i class="bi bi-plus"></i> Tambah Tugas</button></div>
                            <button type="submit" class="btn btn-dlg-blue w-100 rounded-pill">Kirim Laporan</button>
                        </form>
                    </div></div>
                </div>
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm rounded-4"><div class="card-body p-4">
                        <h6 class="fw-bold mb-3">Riwayat Laporan</h6><div id="reportHistoryBody"></div>
                    </div></div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { renderTopBar } from "./element/topbar.js";
        import { renderSidebar } from "./element/sidebar.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, getDoc, getDocs, serverTimestamp, onSnapshot, orderBy, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        const firebaseConfig={apiKey:"AIzaSyDyzzEYbJkkl-N8snrQf14qvj8De4YliV0",authDomain:"pre-dialogika.firebaseapp.com",projectId:"pre-dialogika",storageBucket:"pre-dialogika.firebasestorage.app",messagingSenderId:"343771410480",appId:"1:343771410480:web:32881c9868522090237df5",measurementId:"G-SXN811P3N0"};
        const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
        renderTopBar(document.getElementById('topbarContainer')); renderSidebar(document.getElementById('sidebarContainer'));
        let currentUser=null,currentUserData=null,reportUnsub=null,positionsMap={};
        async function loadPositionsMap(){try{const snap=await getDocs(collection(db,'positions'));snap.forEach(d=>{positionsMap[d.id]=d.data().name||d.data().label||d.id;});}catch(e){console.warn('Failed to load positions:',e);}}
        function resolvePositionName(posId){return positionsMap[posId]||posId;}
        function todayKey(){return new Date().toISOString().split('T')[0];}
        window.addTask=()=>{const c=document.getElementById('tasksContainer');const d=document.createElement('div');d.className='input-group';d.innerHTML='<input type="text" class="form-control report-task" placeholder="Tambah tugas..."><button type="button" class="btn btn-outline-danger" onclick="this.parentElement.remove()"><i class="bi bi-trash"></i></button>';c.appendChild(d);};
        async function submitDailyReport(e){e.preventDefault();const tasks=[...document.querySelectorAll('.report-task')].map(x=>x.value.trim()).filter(Boolean);if(!tasks.length)return alert('Tambahkan minimal satu tugas');await addDoc(collection(db,'intern_dailyreport'),{user_id:currentUser.uid,name:currentUserData.name,department:currentUserData.department,position:currentUserData.positionName,report_date:document.getElementById('reportDate').value,tasks,status:'Pending',submitted_at:serverTimestamp(),reviewer_id:null,reviewed_at:null,rejection_reason:null});document.getElementById('dailyReportForm').reset();initForm();}
        function initForm(){document.getElementById('reportDate').value=todayKey();document.getElementById('tasksContainer').innerHTML='';window.addTask();document.getElementById('dailyReportForm').onsubmit=submitDailyReport;}
        function renderHistory(){const wrap=document.getElementById('reportHistoryBody');if(reportUnsub)reportUnsub();const q=query(collection(db,'intern_dailyreport'),where('user_id','==',currentUser.uid),orderBy('submitted_at','desc'));reportUnsub=onSnapshot(q,s=>{wrap.innerHTML='';if(s.empty){wrap.innerHTML='<p class="text-muted small">Belum ada laporan</p>';return;}s.forEach(d=>{const x=d.data();wrap.insertAdjacentHTML('beforeend',`<div class="history-item"><div class="d-flex justify-content-between"><strong>${x.report_date||'-'}</strong><span class="badge ${x.status==='Approved'?'bg-success':x.status==='Rejected'?'bg-danger':'bg-warning text-dark'}">${x.status||'Pending'}</span></div>${x.status==='Rejected'&&x.rejection_reason?`<div class="text-danger small mt-2">${x.rejection_reason}</div>`:''}<div class="small text-muted mt-2">Reviewer: ${x.reviewer_name||'-'}</div></div>`);});});}
        onAuthStateChanged(auth,async user=>{if(!user)return location.href='index.html';currentUser=user;await loadPositionsMap();const snap=await getDoc(doc(db,'users',user.uid));if(snap.exists()){const d=snap.data();const e=d.employment||{};const posName=resolvePositionName(e.position||'');currentUserData={name:d.name||user.email,department:e.department||'',position:e.position||'',positionName:posName};document.getElementById('reportName').value=currentUserData.name;document.getElementById('reportDeptPos').value=`${currentUserData.department||'-'} / ${posName||'-'}`;}initForm();renderHistory();});
        window.logout=async()=>{await signOut(auth);localStorage.removeItem('userData');location.href='index.html';};
    </script>
</body>
</html>
