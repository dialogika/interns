<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piket Branding - Intern Dialogika</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f8fbff;
            color: #0f172a;
        }

        .piket-hero {
            background: radial-gradient(circle at top right, rgba(255, 255, 255, 0.18), transparent 30%),
                linear-gradient(135deg, #0B2B6A 0%, #1247af 52%, #7204cf 100%);
            color: #ffffff;
            border-radius: 28px;
            padding: 28px;
            box-shadow: 0 24px 60px rgba(11, 43, 106, 0.18);
            overflow: hidden;
            position: relative;
        }

        .piket-hero::after {
            content: "";
            position: absolute;
            right: -70px;
            top: -80px;
            width: 240px;
            height: 240px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
        }

        .piket-stat-card,
        .piket-panel,
        .schedule-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 12px 34px rgba(15, 23, 42, 0.05);
        }

        .piket-stat-card {
            border-radius: 22px;
            padding: 18px;
            min-height: 106px;
        }

        .piket-panel {
            border-radius: 24px;
        }

        .schedule-card {
            border-radius: 22px;
            overflow: hidden;
        }

        .schedule-type-bar {
            width: 6px;
            border-radius: 999px;
            flex-shrink: 0;
        }

        .type-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 11px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.03em;
        }

        .assignment-card {
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            background: #f8fafc;
            padding: 12px;
        }

        .assignment-members {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .assignment-group-single .assignment-members {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 10px;
            align-items: start;
        }

        .assignment-member-item {
            min-width: 0;
        }

        .assignment-group-single .assignment-member-item {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 10px;
            height: 100%;
        }

        .assignment-member-name {
            font-size: 12px;
        }

        .assignment-role-label,
        .assignment-task-desc {
            font-size: 11px;
        }

        .assignment-task-title {
            font-size: 12px;
        }

        .task-bullet {
            border-left: 3px solid #cbd5e1;
            padding-left: 8px;
            margin-top: 6px;
        }

        .field-label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }

        .member-avatar {
            width: 28px;
            height: 28px;
            border-radius: 999px;
            object-fit: cover;
            background: #e2e8f0;
            border: 2px solid #ffffff;
        }

        .empty-state {
            border: 1px dashed #cbd5e1;
            border-radius: 24px;
            background: #ffffff;
            padding: 46px 18px;
            text-align: center;
            color: #64748b;
        }

            .today-strip {
            border-radius: 22px;
            background: #ffffff;
            border: 1px solid #dbeafe;
            box-shadow: 0 12px 34px rgba(37, 99, 235, 0.06);
        }

        .user-duty-notice {
            border-radius: 22px;
            background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%);
            border: 1px solid #bfdbfe;
            box-shadow: 0 12px 34px rgba(37, 99, 235, 0.08);
        }

        .user-duty-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .today-duty-card {

            border: 1px solid #e2e8f0;
            border-radius: 14px;
            background: #f8fafc;
            padding: 11px;
            min-height: 126px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .today-duty-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
        }

        .today-duty-card.border-2 {
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.15);
        }

        .today-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
        }

        .today-avatar {
            width: 26px;
            height: 26px;
        }

        .today-type-pill {
            padding: 3px 8px;
            font-size: 10px;
            line-height: 1.2;
            max-width: 100%;
            white-space: normal;
            text-align: left;
        }

        .today-member-name {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.25;
            word-break: break-word;
        }

        .today-task-line {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .today-task-clamp {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .piket-hero {
                padding: 22px;
                border-radius: 22px;
            }

            .main-content {
                padding-left: 18px;
                padding-right: 18px;
            }
        }
    </style>

    <script type="module" src="../assets/js/auth-guard.js"></script>
</head>
<body>
    <div id="topbarContainer"></div>

    <div class="dashboard-container">
        <div id="sidebarContainer"></div>

        <main class="main-content">
            <section class="piket-hero mb-4">
                <div class="position-relative" style="z-index: 1;">
                    <div class="d-flex flex-column flex-lg-row justify-content-between gap-3 align-items-lg-center">
                        <div>
                            <span class="badge rounded-pill bg-white text-primary fw-bold mb-3 px-3 py-2">Branding Duty Board</span>
                            <h1 class="fw-bold mb-2">Piket Branding</h1>
                            <p class="mb-0 text-white-50">Lihat jadwal piket, anggota yang bertugas, dan detail tugas yang sudah dibuat oleh Team.</p>
                        </div>
                        <div class="text-lg-end">
                            <div class="small text-white-50">Hari ini</div>
                            <div class="fw-bold fs-5" id="todayLabel">-</div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="row g-3 mb-4">
                <div class="col-6 col-xl-3">
                    <div class="piket-stat-card h-100">
                        <div class="text-muted small fw-semibold">Tugas Hari Ini</div>
                        <div class="h3 fw-bold mb-0" id="statToday">0</div>
                    </div>
                </div>
                <div class="col-6 col-xl-3">
                    <div class="piket-stat-card h-100">
                        <div class="text-muted small fw-semibold">Jadwal Aktif</div>
                        <div class="h3 fw-bold mb-0" id="statActive">0</div>
                    </div>
                </div>
                <div class="col-6 col-xl-3">
                    <div class="piket-stat-card h-100">
                        <div class="text-muted small fw-semibold">Anggota Bertugas</div>
                        <div class="h3 fw-bold mb-0" id="statMembers">0</div>
                    </div>
                </div>
                <div class="col-6 col-xl-3">
                    <div class="piket-stat-card h-100">
                        <div class="text-muted small fw-semibold">Jenis Piket</div>
                        <div class="h3 fw-bold mb-0" id="statTypes">0</div>
                    </div>
                </div>
            </section>

            <section class="user-duty-notice p-3 p-lg-4 mb-3 d-none" id="userDutyNotice"></section>

            <section class="today-strip p-2 p-lg-3 mb-3" id="todaySection">
                <div class="d-flex flex-column flex-lg-row justify-content-between gap-1 align-items-lg-center mb-2">
                    <div>
                        <h6 class="fw-bold mb-0"><i class="bi bi-stars text-primary me-2"></i>Piket Hari Ini</h6>
                        <div class="text-muted" style="font-size: 11px;">Ringkasan tugas hari ini</div>
                    </div>
                </div>
                <div id="todayList" class="today-grid">
                    <div class="text-muted small">Memuat piket hari ini...</div>
                </div>
            </section>

            <section class="piket-panel p-3 p-lg-4 mb-4">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4 col-xl-3">
                        <label class="field-label">Cari Jadwal</label>
                        <input type="text" class="form-control rounded-3" id="searchInput" placeholder="Cari judul, anggota, tugas...">
                    </div>
                    <div class="col-md-4 col-xl-3">
                        <label class="field-label">Jenis Piket</label>
                        <select class="form-select rounded-3" id="typeFilter">
                            <option value="">Semua Jenis</option>
                        </select>
                    </div>
                    <div class="col-md-4 col-xl-3">
                        <label class="field-label">Periode</label>
                        <select class="form-select rounded-3" id="periodFilter">
                            <option value="all">Semua Periode</option>
                            <option value="today">Hari Ini</option>
                            <option value="week" selected>Minggu Ini</option>
                            <option value="month">Bulan Ini</option>
                        </select>
                    </div>
                    <div class="col-md-4 col-xl-3">
                        <label class="field-label">Status</label>
                        <select class="form-select rounded-3" id="statusFilter">
                            <option value="">Semua Status</option>
                            <option value="scheduled">Scheduled</option>
                            <option value="completed">Completed</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="d-flex flex-column gap-3" id="scheduleList">
                <div class="empty-state">
                    <div class="spinner-border text-primary mb-3" role="status"></div>
                    <div class="fw-semibold">Memuat jadwal piket...</div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        import { renderTopBar } from "../element/topbar.js";
        import { renderSidebar } from "../element/sidebar.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDyzzEYbJkkl-N8snrQf14qvj8De4YliV0",
            authDomain: "pre-dialogika.firebaseapp.com",
            projectId: "pre-dialogika",
            storageBucket: "pre-dialogika.firebasestorage.app",
            messagingSenderId: "343771410480",
            appId: "1:343771410480:web:32881c9868522090237df5",
            measurementId: "G-SXN811P3N0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        renderTopBar(document.getElementById('topbarContainer'));
        renderSidebar(document.getElementById('sidebarContainer'));

        let dutyTypes = [];
        let schedules = [];
        let currentUser = null;
        let typeUnsubscribe = null;
        let scheduleUnsubscribe = null;

        const els = {
            scheduleList: document.getElementById('scheduleList'),
            todayList: document.getElementById('todayList'),
            typeFilter: document.getElementById('typeFilter'),
            periodFilter: document.getElementById('periodFilter'),
            statusFilter: document.getElementById('statusFilter'),
            searchInput: document.getElementById('searchInput'),
            userDutyNotice: document.getElementById('userDutyNotice')
        };

        document.getElementById('todayLabel').textContent = formatFullDate(new Date());

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = '../index.html';
                return;
            }

            currentUser = user;
            startListeners();
        });

        function startListeners() {
            if (typeUnsubscribe) typeUnsubscribe();
            if (scheduleUnsubscribe) scheduleUnsubscribe();

            typeUnsubscribe = onSnapshot(collection(db, 'duty_types'), (snapshot) => {
                dutyTypes = [];
                snapshot.forEach(docSnap => dutyTypes.push({ id: docSnap.id, ...docSnap.data() }));
                dutyTypes.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                renderTypeOptions();
                renderSchedules();
            }, (error) => {
                console.error('Failed to listen duty types', error);
                renderSchedules();
            });

            scheduleUnsubscribe = onSnapshot(query(collection(db, 'duty_schedules'), orderBy('start_date', 'desc')), (snapshot) => {
                schedules = [];
                snapshot.forEach(docSnap => schedules.push({ id: docSnap.id, ...docSnap.data() }));
                renderSchedules();
            }, (error) => {
                console.error('Failed to listen schedules', error);
                els.scheduleList.innerHTML = `<div class="empty-state"><i class="bi bi-exclamation-triangle text-danger fs-2 d-block mb-2"></i>Gagal memuat jadwal piket.</div>`;
                els.todayList.innerHTML = '<div class="text-muted small">Gagal memuat piket hari ini.</div>';
            });
        }

        function renderTypeOptions() {
            const current = els.typeFilter.value;
            els.typeFilter.innerHTML = '<option value="">Semua Jenis</option>';

            dutyTypes.filter(type => type.is_active !== false).forEach(type => {
                const opt = document.createElement('option');
                opt.value = type.id;
                opt.textContent = type.name || type.id;
                els.typeFilter.appendChild(opt);
            });

            if (current) els.typeFilter.value = current;
        }

        function renderSchedules() {
            const filtered = getFilteredSchedules();
            updateStats(filtered);
            renderTodayList();
            renderUserNotice();

            if (!filtered.length) {
                els.scheduleList.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-calendar2-week fs-1 text-primary d-block mb-3"></i>
                        <div class="fw-bold text-dark mb-1">Belum ada jadwal piket</div>
                        <div class="small">Jadwal akan muncul setelah dibuat oleh Team.</div>
                    </div>
                `;
                return;
            }

            els.scheduleList.innerHTML = filtered.map(schedule => renderScheduleCard(schedule)).join('');
        }

        function renderTodayList() {
            const today = startOfDay(new Date());
            const todayAssignments = [];

            schedules.forEach(schedule => {
                if (schedule.status === 'archived' || schedule.status === 'cancelled') return;
                const assignments = Array.isArray(schedule.assignments) ? schedule.assignments : [];
                assignments.forEach(item => {
                    const assignmentDate = startOfDay(toDate(item.assignment_date || schedule.start_date));
                    if (assignmentDate.getTime() === today.getTime()) {
                        todayAssignments.push({ schedule, item });
                    }
                });
            });

            if (!todayAssignments.length) {
                els.todayList.innerHTML = '<div class="text-muted small">Tidak ada piket yang terjadwal hari ini.</div>';
                return;
            }

            els.todayList.innerHTML = todayAssignments.map(({ schedule, item }) => {
                const type = getType(schedule.type_id);
                const color = type?.color || schedule.type_color || '#0B2B6A';
                const tasks = Array.isArray(item.tasks) ? item.tasks : [];
                const isMe = currentUser && item.user_id === currentUser.uid;

                return `
                    <div class="today-duty-card${isMe ? ' border-primary border-2' : ''}"${isMe ? ' style="background:#f0f7ff;"' : ''}>
                        <div>
                            <div class="d-flex align-items-start gap-2 mb-2">
                                <div class="d-flex align-items-start gap-2 min-w-0 flex-grow-1">
                                    <img class="member-avatar today-avatar" src="${escapeAttr(item.photo || `https://i.pravatar.cc/120?u=${item.user_id || item.name || 'member'}`)}" alt="">
                                    <div class="today-member-name">${escapeHtml(item.name || 'Tanpa Nama')}</div>
                                </div>
                                ${isMe ? '<span class="badge bg-primary rounded-pill" style="font-size:9px;">Anda</span>' : ''}
                            </div>
                            <span class="type-pill today-type-pill mb-2" style="background:${hexToRgba(color, 0.12)}; color:${escapeAttr(color)}">${escapeHtml(schedule.type_name || type?.name || 'Jenis Piket')}</span>
                            <div class="fw-semibold today-task-clamp" style="font-size: 12px; line-height: 1.35;">${escapeHtml(schedule.title || 'Tanpa Judul')}</div>
                            ${item.role_label ? `<div class="text-muted today-task-line mt-1" style="font-size: 11px;">${escapeHtml(item.role_label)}</div>` : ''}
                        </div>
                        ${tasks.length ? `<div class="mt-2 pt-2 border-top text-muted today-task-clamp" style="font-size: 11px; line-height: 1.35;">${tasks.map(task => escapeHtml(task.title || task.description || 'Tugas')).join(', ')}</div>` : ''}
                        </div>
                `;
            }).join('');
        }

        function renderUserNotice() {
            if (!currentUser) return;

            const today = startOfDay(new Date());
            const userAssignmentsToday = [];

            schedules.forEach(schedule => {
                if (schedule.status === 'archived' || schedule.status === 'cancelled') return;
                const assignments = Array.isArray(schedule.assignments) ? schedule.assignments : [];
                assignments.forEach(item => {
                    if (item.user_id !== currentUser.uid) return;

                    const assignmentDate = startOfDay(toDate(item.assignment_date || schedule.start_date));
                    if (assignmentDate.getTime() === today.getTime()) {
                        userAssignmentsToday.push({ schedule, item });
                    }
                });
            });

            if (userAssignmentsToday.length > 0) {
                const noticeEl = els.userDutyNotice;
                const dutyInfo = userAssignmentsToday.map(({ schedule, item }) => {
                    const type = getType(schedule.type_id);
                    const color = type?.color || schedule.type_color || '#0B2B6A';
                    return `
                        <div class="user-duty-badge" style="background:${hexToRgba(color, 0.15)}; color:${escapeAttr(color)}">
                            <i class="bi bi-person-check-fill"></i>
                            <span>${escapeHtml(schedule.type_name || type?.name || 'Piket')}</span>
                        </div>
                    `;
                }).join('');

                noticeEl.innerHTML = `
                    <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
                        <div class="flex-grow-1">
                            <h5 class="fw-bold mb-1">Anda memiliki jadwal piket hari ini!</h5>
                            <p class="text-muted mb-0">Anda ditugaskan untuk piket berikut. Pastikan untuk memeriksa detail dan menyelesaikan tugas Anda.</p>
                        </div>
                        <div class="d-flex flex-wrap gap-2 align-self-start align-self-lg-center">
                            ${dutyInfo}
                        </div>
                    </div>
                `;
                noticeEl.classList.remove('d-none');
            } else {
                els.userDutyNotice.classList.add('d-none');
            }
        }

        function getFilteredSchedules() {
            const typeFilter = els.typeFilter.value;
            const statusFilter = els.statusFilter.value;
            const periodFilter = els.periodFilter.value;
            const search = els.searchInput.value.trim().toLowerCase();
            const range = getPeriodRange(periodFilter);

            return schedules.filter(schedule => {
                if (schedule.status === 'archived') return false;
                if (typeFilter && schedule.type_id !== typeFilter) return false;
                if (statusFilter && schedule.status !== statusFilter) return false;
                if (range && !isRangeOverlap(toDate(schedule.start_date), toDate(schedule.end_date), range.start, range.end)) return false;
                if (search && !scheduleMatchesSearch(schedule, search)) return false;
                return true;
            }).sort((a, b) => toDate(a.start_date) - toDate(b.start_date));
        }

        function renderScheduleCard(schedule) {
            const type = getType(schedule.type_id);
            const color = type?.color || schedule.type_color || '#0B2B6A';
            const icon = type?.icon || 'bi-calendar-check';
            const assignments = Array.isArray(schedule.assignments) ? schedule.assignments : [];
            const grouped = groupAssignments(assignments);
            const groupKeys = Object.keys(grouped);
            const period = formatPeriod(schedule.start_date, schedule.end_date);
            const statusClass = schedule.status === 'completed' ? 'success' : schedule.status === 'cancelled' ? 'danger' : 'primary';

            return `
                <article class="schedule-card">
                    <div class="p-3 p-lg-4">
                        <div class="d-flex gap-3">
                            <div class="schedule-type-bar" style="background:${escapeAttr(color)}"></div>
                            <div class="flex-grow-1 min-w-0">
                                <div class="d-flex flex-column flex-lg-row justify-content-between gap-3">
                                    <div>
                                        <span class="type-pill mb-2" style="background:${hexToRgba(color, 0.12)}; color:${escapeAttr(color)}">
                                            <i class="bi ${escapeAttr(icon)}"></i>${escapeHtml(schedule.type_name || type?.name || 'Jenis Piket')}
                                        </span>
                                        <h5 class="fw-bold mb-1">${escapeHtml(schedule.title || 'Tanpa Judul')}</h5>
                                        <div class="text-muted small"><i class="bi bi-calendar-range me-1"></i>${period}</div>
                                        ${schedule.description ? `<p class="text-muted small mt-2 mb-0">${escapeHtml(schedule.description)}</p>` : ''}
                                    </div>
                                    <div class="d-flex align-items-start gap-2 flex-wrap justify-content-lg-end">
                                        <span class="badge rounded-pill text-bg-${statusClass} text-uppercase">${escapeHtml(schedule.status || 'scheduled')}</span>
                                    </div>
                                </div>

                                <div class="row g-3 mt-2">
                                    ${groupKeys.length ? groupKeys.map(key => renderAssignmentGroup(key, grouped[key], color, groupKeys.length === 1)).join('') : '<div class="col-12 text-muted small">Belum ada anggota yang ditugaskan.</div>'}
                                </div>
                            </div>
                        </div>
                    </div>
                </article>
            `;
        }

        function renderAssignmentGroup(dateKey, group, color, isSingleDay = false) {
            return `
                <div class="${isSingleDay ? 'col-12' : 'col-md-6 col-xl-4'}">
                    <div class="assignment-card h-100 ${isSingleDay ? 'assignment-group-single' : ''}">
                        <div class="fw-bold text-dark mb-3 ${isSingleDay ? 'small' : ''}"><i class="bi bi-clock me-1" style="color:${escapeAttr(color)}"></i>${escapeHtml(dateKey)}</div>
                        <div class="assignment-members">
                            ${group.map(item => renderAssignmentItem(item, color)).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAssignmentItem(item, color) {
            const tasks = Array.isArray(item.tasks) ? item.tasks : [];
            const isMe = currentUser && item.user_id === currentUser.uid;
            
            return `
                <div class="assignment-member-item${isMe ? ' border-primary' : ''}"${isMe ? ' style="border:1px solid #0d6efd; background:#f0f7ff; border-radius:14px; padding:10px;"' : ''}>
                    <div class="d-flex align-items-center justify-content-between gap-2">
                        <div class="d-flex align-items-center gap-2">
                            <img class="member-avatar" src="${escapeAttr(item.photo || `https://i.pravatar.cc/120?u=${item.user_id || item.name || 'member'}`)}" alt="">
                            <div>
                                <div class="fw-semibold assignment-member-name">${escapeHtml(item.name || 'Tanpa Nama')}</div>
                                ${item.role_label ? `<div class="text-muted assignment-role-label">${escapeHtml(item.role_label)}</div>` : ''}
                            </div>
                        </div>
                        ${isMe ? '<span class="badge bg-primary rounded-pill" style="font-size:9px;">Anda</span>' : ''}
                    </div>
                    ${tasks.length ? tasks.map(task => `
                        <div class="task-bullet" style="border-color:${escapeAttr(color)}">
                            <div class="fw-semibold text-dark assignment-task-title">${escapeHtml(task.title || 'Tugas')}</div>
                            ${task.description ? `<div class="text-muted assignment-task-desc">${escapeHtml(task.description)}</div>` : ''}
                        </div>
                    `).join('') : ''}
                </div>
            `;
        }

        function updateStats(filtered) {
            const today = startOfDay(new Date());
            const members = new Set();
            let todayCount = 0;

            filtered.forEach(schedule => {
                const assignments = Array.isArray(schedule.assignments) ? schedule.assignments : [];
                assignments.forEach(item => {
                    if (item.user_id || item.name) members.add(item.user_id || item.name);
                    const date = startOfDay(toDate(item.assignment_date || schedule.start_date));
                    if (date.getTime() === today.getTime()) todayCount++;
                });
            });

            document.getElementById('statToday').textContent = todayCount;
            document.getElementById('statActive').textContent = filtered.filter(s => (s.status || 'scheduled') === 'scheduled').length;
            document.getElementById('statMembers').textContent = members.size;
            document.getElementById('statTypes').textContent = dutyTypes.filter(t => t.is_active !== false).length;
        }

        function groupAssignments(assignments) {
            const grouped = {};
            assignments.forEach(item => {
                const label = item.assignment_date ? formatFullDate(item.assignment_date) : 'Tanggal utama';
                if (!grouped[label]) grouped[label] = [];
                grouped[label].push(item);
            });
            return grouped;
        }

        function getType(id) {
            return dutyTypes.find(type => type.id === id);
        }

        function scheduleMatchesSearch(schedule, search) {
            const text = [schedule.title, schedule.description, schedule.type_name, schedule.period_label]
                .concat((schedule.assignments || []).flatMap(item => [item.name, item.role_label].concat((item.tasks || []).flatMap(task => [task.title, task.description]))))
                .filter(Boolean)
                .join(' ')
                .toLowerCase();
            return text.includes(search);
        }

        function getPeriodRange(period) {
            const now = new Date();
            if (period === 'all') return null;
            if (period === 'today') {
                return { start: startOfDay(now), end: endOfDay(now) };
            }
            if (period === 'week') {
                const day = now.getDay();
                const diff = day === 0 ? -6 : 1 - day;
                const start = startOfDay(new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff));
                const end = endOfDay(new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6));
                return { start, end };
            }
            if (period === 'month') {
                return { start: startOfDay(new Date(now.getFullYear(), now.getMonth(), 1)), end: endOfDay(new Date(now.getFullYear(), now.getMonth() + 1, 0)) };
            }
            return null;
        }

        function isRangeOverlap(startA, endA, startB, endB) {
            if (!startA || !endA) return false;
            return startA <= endB && endA >= startB;
        }

        function toDate(value) {
            if (!value) return new Date();
            if (value.toDate) return value.toDate();
            return new Date(value);
        }

        function formatFullDate(value) {
            const d = toDate(value);
            return d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }

        function formatPeriod(start, end) {
            const s = toDate(start);
            const e = toDate(end || start);
            if (s.toDateString() === e.toDateString()) return formatFullDate(s);
            return `${s.toLocaleDateString('id-ID', { day: 'numeric', month: 'long' })} - ${e.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}`;
        }

        function startOfDay(date) {
            return new Date(date.getFullYear(), date.getMonth(), date.getDate());
        }

        function endOfDay(date) {
            return new Date(date.getFullYear(), date.getMonth(), date.getDate(), 23, 59, 59, 999);
        }

        function hexToRgba(hex, alpha) {
            const normalized = String(hex || '#0B2B6A').replace('#', '');
            const bigint = parseInt(normalized.length === 3 ? normalized.split('').map(c => c + c).join('') : normalized, 16);
            const r = (bigint >> 16) & 255;
            const g = (bigint >> 8) & 255;
            const b = bigint & 255;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[ch]));
        }

        function escapeAttr(value) {
            return escapeHtml(value).replace(/`/g, '&#96;');
        }

        [els.typeFilter, els.periodFilter, els.statusFilter].forEach(el => el.addEventListener('change', renderSchedules));
        els.searchInput.addEventListener('input', renderSchedules);
    </script>
</body>
</html>
